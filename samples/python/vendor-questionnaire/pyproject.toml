[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webiq-vendor-questionnaire"
version = "0.1.0"
description = "Pre-fill a vendor security questionnaire from the vendor's public pages with Web IQ Browse passages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
webiq-vendor-questionnaire = "webiq_vendor_questionnaire.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
