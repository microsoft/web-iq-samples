<html lang="en">
<head>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in - WebIQ Briefing</title>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cp-bg); color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      display: grid; min-height: 100dvh; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 440px; padding: 32px; border: 1px solid var(--cp-border);
      border-radius: 16px; background: var(--cp-surface); }
    .brand { color: var(--cp-accent); font-weight: 700; }
    h1 { font-size: 28px; margin: 20px 0 12px; }
    p { color: var(--cp-text-muted); line-height: 1.5; }
    label { display: block; font-weight: 600; margin: 24px 0 8px; }
    input, button { width: 100%; font: inherit; border-radius: 0.625rem; padding: 12px; }
    input { background: var(--cp-bg-elevated); color: var(--cp-text); border: 1px solid var(--cp-border-strong); }
    button { margin-top: 16px; background: var(--cp-accent); color: var(--cp-accent-fg); border: 0; cursor: pointer; }
    button:hover { background: var(--cp-accent-hover); }
    :focus-visible { outline: 3px solid var(--cp-link); outline-offset: 3px; }
    #error { color: var(--cp-danger); min-height: 24px; }
    small { color: var(--cp-text-soft); }
  </style>
</head>
<body>
  <main>
    <div class="brand">WebIQ Briefing / Private demo</div>
    <h1>Your briefing starts here.</h1>
    <p>Enter the shared demo passphrase. Only people with the link and passphrase can start a conversation.</p>
    <form method="post" action="/api/login">
      <input type="hidden" name="csrf" value="<!--CSRF-->">
      <label for="passphrase">Demo passphrase</label>
      <input id="passphrase" type="password" name="passphrase" required maxlength="256" autocomplete="off">
      <button type="submit">Enter private demo</button>
      <p id="error" role="alert"></p>
    </form>
    <small>Access expires after one hour. Up to 10 conversations at a time. No recordings saved.</small>
  </main>
  <script>
    const form = document.querySelector("form");
    const button = document.querySelector("button");
    form.addEventListener("submit", async event => {
      event.preventDefault();
      button.disabled = true;
      document.querySelector("#error").textContent = "";
      try {
        const response = await fetch("/api/login", {
          method: "POST", body: new URLSearchParams(new FormData(form)),
          credentials: "same-origin", signal: AbortSignal.timeout(10000)
        });
        form.elements.passphrase.value = "";
        if (response.ok && response.redirected) { location.replace("/"); return; }
        const result = await response.json();
        document.querySelector("#error").textContent = result.error || "Sign-in failed. Reload and try again.";
      } catch {
        form.elements.passphrase.value = "";
        document.querySelector("#error").textContent = "Sign-in could not finish. Reload and try again.";
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
