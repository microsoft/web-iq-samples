[project]
name = "webiq-foundry-voice-agent"
version = "0.1.0"
description = "Native Microsoft Foundry voice agent grounded by Web IQ news search"
requires-python = ">=3.11"
dependencies = [
  "azure-ai-projects[voice]==2.7.0",
  "azure-identity>=1.25,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
