[package]
name = "webiq-scopes"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Manage named Web IQ scopes and use them with the web endpoint."

[features]
default = []
certificate-auth = ["dep:azure_core", "dep:azure_identity", "dep:openssl"]

[dependencies]
azure_core = { version = "1.0", optional = true }
azure_identity = { version = "1.0", features = ["client_certificate"], optional = true }
clap = { version = "4.5", features = ["derive"] }
openssl = { version = "0.10", features = ["vendored"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
