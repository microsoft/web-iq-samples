[package]
name = "webiq-scopes"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Manage named Web IQ scopes and use them with the web endpoint."

[dependencies]
azure_core = "1.0"
azure_identity = { version = "1.0", features = ["client_certificate"] }
clap = { version = "4.5", features = ["derive"] }
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
